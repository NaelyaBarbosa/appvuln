rules:
  - id: python-os-system
    languages:
      - python
    message: "Uso de os.system() detectado. Avalie risco de command injection."
    severity: WARNING
    patterns:
      - pattern: os.system(...)
      - pattern: subprocess.run($CMD,user_input,shell=True)
      - pattern: os.popen(...)

